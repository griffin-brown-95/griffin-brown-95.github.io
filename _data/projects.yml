# Each project renders as a row in the homepage index, in this order. Clicking a row
# wipes open the full project (linkable at /#<slug>). Lead with the why; the how comes last.
#
# Fields (only title and why are required):
#   title, kicker        heading and a one-line context above it
#   slug                 optional: URL hash; defaults to the title, slugified
#   summary              optional: one-line teaser in the index; defaults to a trimmed `why`
#   category, year       shown in the index; categories become filter chips once there are 2+
#   why                  the problem and why it was worth solving (HTML allowed)
#   before / after       lists: the old way vs. what the project changed
#   outcome              optional: a measurable result, shown as a callout
#   next                 optional: where the project goes from here
#   pipeline             optional: list of {name, note} build steps
#   how                  optional: a sentence on the build
#   tags                 tools used
#   links                list of {label, url}; label "Code" gets the GitHub icon

- title: A or B?
  slug: a-or-b
  kicker: Live choice experiment &middot; what nudges a decision
  category: Experimentation
  year: 2026
  summary: A pick-one game that quietly randomizes color, fill, size, position and layout to measure what actually sways a choice.
  why: >-
    What easier way to create an experiment than to simply prompt a user to choose A or B?
    I wanted an honest, live measurement of that, built the way a growth team would build it:
    reliable assignment, exposure logging and data you can trust. 

    This was also an exercise to learn a bit about Go and API development.
  before:
    - Which button wins? Settled by opinion or a single A/B test
    - One change tested at a time, so each test teaches one thing
    - Results trusted without checking the randomization itself
  after:
    - Seven factors randomized independently on every pick, so every visit informs all of them
    - Server-side assignment with salted hashes; an exposure is logged only once the options are actually on screen
    - Live results with 95% ranges, a minimum sample before anything is shown, and an automatic sample-ratio check
  next: >-
    With enough data: one model of all factors at once to find the most-picked layout, and a look at whether
    the nudges fade for people who come back to play every day.
  pipeline:
    - { name: Browser, note: "vanilla JS · GitHub Pages" }
    - { name: nudge API, note: "Go · Cloud Run" }
    - { name: Postgres, note: "Supabase · row-level security" }
    - { name: SQL views, note: "win rates · matchups · traces" }
    - { name: Dashboard, note: "GET /stats · live" }
  how: >-
    A Go service on Cloud Run assigns every trial and validates every event before it's stored; the browser never
    touches the database. Balance and independence tests on the randomizer run in CI.
  tags: [Go, PostgreSQL, Supabase, Google Cloud Run, Docker, GitHub Actions, JavaScript]
  links:
    - { label: App, url: "https://griffin-brown-95.github.io/nudge/" }
    - { label: Live dashboard, url: "https://griffin-brown-95.github.io/nudge/dashboard/" }
    - { label: Code, url: "https://github.com/griffin-brown-95/nudge" }

- title: Blade Runner
  kicker: Automated performance data &middot; US Speedskating short track
  category: Data Engineering
  year: 2026
  summary: Replaced a weekly CSV-and-Excel routine with a pipeline that keeps US Speed Skating coaches' lap data current every night.
  why: >-
    Coaches need to see each skater's <strong>progress</strong> and <strong>training load</strong>.
    The lap data already existed; getting it into a usable shape was the bottleneck.
  before:
    - Download CSV exports from the timing website by hand
    - Clean, merge and chart everything in Excel
    - Repeat every week, spending hours on data prep instead of on athletes
  after:
    - Every lap is pulled automatically, every night
    - One consistent model of skaters, sessions and laps
    - A dashboard that's already current when coaches open it
  next: >-
    On-ice laps are one piece of an athlete's load. The same foundation can take in gym and
    heart-rate data, so staff can weigh total load against progress.
  pipeline:
    - { name: Sporthive API, note: "MYLAPS lap timing" }
    - { name: ingest.py, note: "nightly incremental scrape" }
    - { name: SQLite, note: "activities · sessions · laps" }
    - { name: SQL views, note: "skater_day · totals" }
    - { name: Dashboards, note: "GitHub Pages + Streamlit" }
  how: >-
    Scheduled with GitHub Actions and hosted on GitHub Pages, so there are no servers and no cloud bill.
    The metric views are plain SQL and can move to Snowflake as the program grows.
  tags: [Python, SQL, SQLite, GitHub Actions, GitHub Pages, Streamlit, pandas]
  links:
    - { label: Live dashboard, url: "https://griffin-brown-95.github.io/blade_runner/" }
    - { label: Code, url: "https://github.com/griffin-brown-95/blade_runner" }
