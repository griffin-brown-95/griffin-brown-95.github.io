# Work experience, rendered in the homepage Experience section.
#
# disciplines   the tabs, in order. A tab only appears once it has at least one highlight.
# roles         the timeline. `key` is how highlights point at a role.
# highlights    one card each. Lead with the why and the result; the how is the footer.
#   title, why          required (why allows HTML)
#   metric, metric_label  optional headline number, e.g. "20+ hrs" / "of manual reporting cut each week"
#   tags                which tabs the card appears under (keys from `disciplines`)
#   role                key from `roles`
#   tools               short list of tools
#   case_study          slug of an entry in `case_studies`; adds a "Read the case study" link
#   featured            true makes the card full width
# case_studies  long-form write-ups that open in an overlay, linkable at /#<slug>.
#
# Keep employer figures public-safe: percentages and directions, no dollar totals or internal table names.

disciplines:
  - { key: science, label: Data Science }
  - { key: engineering, label: Data Engineering }
  - { key: analysis, label: Data Analysis }
  - { key: more, label: More }

