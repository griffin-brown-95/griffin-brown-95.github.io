<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <script>
      // Apply the saved/system theme before paint to avoid a flash.
      (function () {
         var t;
         try { t = localStorage.getItem("theme"); } catch (e) {}
         if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
         }
         document.documentElement.setAttribute("data-theme", t);
      })();
   </script>
   {% seo %}
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
</head>
<body>
   <div class="bg-glow" aria-hidden="true"></div>

   <nav class="nav">
      <div class="container nav-inner">
         <a class="brand" href="{{ "/" | relative_url }}">
            <span class="brand-mark">GB</span>
            <span class="brand-name">{{ site.title }}</span>
         </a>
         <div class="nav-links">
            <a href="{{ "/#projects" | relative_url }}">Projects</a>
            <a class="nav-ext" href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a>
            <a class="nav-ext" href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
               <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
               <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
         </div>
      </div>
   </nav>

   <main class="container">
      {{ content }}
   </main>

   <footer class="footer">
      <div class="container footer-inner">
         <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
         <span class="footer-links">
            <a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a>
            <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
         </span>
      </div>
   </footer>

   <script>
      (function () {
         var root = document.documentElement;
         var btn = document.getElementById("theme-toggle");
         function sync() {
            var dark = root.getAttribute("data-theme") === "dark";
            btn.setAttribute("aria-pressed", dark);
            btn.title = dark ? "Switch to light mode" : "Switch to dark mode";
         }
         btn.addEventListener("click", function () {
            var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
            sync();
         });
         sync();
      })();
   </script>
</body>
</html>
